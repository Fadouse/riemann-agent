version: 1

compaction:
  # default uses semantic checkpoints; snapshot requires an image-capable model;
  # openai requires OpenAI Codex OAuth. Riemann never switches implicitly.
  strategy: default

agents:
  # Reusable child identities in one run. The Main Agent is not counted.
  # Up to four run concurrently; use 0 to disable delegation.
  maxAgents: 4
  main:
    # Defaults to read and write "/" with no exclusions. Relative entries
    # resolve against the project working directory; `~` expands to the user home.
    filesystem:
      read: ["/"]
      write: ["/"]
  defaults:
    # Omit model to inherit the Main Agent model.
    model: anthropic/claude-sonnet-4-5
    workspace: shared
    # shared children inherit every filesystem field from their caller;
    # worktree children inherit reads and default writes to their own worktree.
    filesystem:
      read: inherit
      write: inherit

mcp:
  servers:
    filesystem_docs:
      description: Example stdio MCP server; disabled until configured.
      enabled: false
      command: npx
      args:
        - -y
        - '@modelcontextprotocol/server-filesystem'
        - .
      startupTimeoutMs: 15000
      toolTimeoutMs: 60000

web:
  searchBackend: exa
  exaApiKey: '${EXA_API_KEY}'
